<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>သဲလေးအတွက် တောင်းပန်လွှာ ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Font for Myanmar Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Padauk", "Poppins", sans-serif;
      }

      /* Floating background hearts animation */
      .bg-heart {
        position: absolute;
        color: rgba(244, 114, 182, 0.25);
        animation: float 8s infinite linear;
        z-index: 0;
        pointer-events: none;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) rotate(0deg) scale(0.8);
          opacity: 0.8;
        }
        100% {
          transform: translateY(-10vh) rotate(360deg) scale(1.2);
          opacity: 0;
        }
      }

      /* Smooth card transitions */
      .fade-in {
        animation: fadeIn 0.5s ease-in-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Custom dodge button transition */
      .runaway-btn {
        transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Pulse glow animation */
      .pulse-glow {
        animation: pulseGlow 2s infinite ease-in-out;
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }
        50% {
          box-shadow: 0 0 25px rgba(244, 63, 94, 0.7);
        }
      }

      /* Sparkle animation */
      @keyframes sparkleAnim {
        0% {
          transform: scale(0) rotate(0deg);
          opacity: 0;
        }
        50% {
          transform: scale(1.2) rotate(180deg);
          opacity: 1;
        }
        100% {
          transform: scale(0) rotate(360deg);
          opacity: 0;
        }
      }

      .sparkle {
        position: absolute;
        pointer-events: none;
        animation: sparkleAnim 0.8s ease-in-out forwards;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-rose-100 via-pink-100 to-amber-50 min-h-screen flex items-center justify-center p-4 overflow-hidden relative selection:bg-rose-200"
  >
    <!-- Background Floating Hearts Container -->
    <div
      id="heartsContainer"
      class="fixed inset-0 overflow-hidden pointer-events-none z-0"
    ></div>

    <!-- Main Card Container -->
    <main
      class="relative z-10 w-full max-w-lg bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl border border-white/60 p-6 md:p-8 text-center transition-all duration-300"
    >
      <!-- Header Sticker Icon -->
      <div class="mb-4 relative inline-block">
        <div
          id="stickerIcon"
          class="text-6xl md:text-7xl transform transition-transform duration-300 hover:scale-110"
        >
          🐱‍💻
        </div>
        <span
          class="absolute -top-2 -right-2 bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full shadow-md animate-bounce"
        >
          Special!
        </span>
      </div>

      <!-- Dynamic Content Box -->
      <div
        id="contentBox"
        class="fade-in min-h-[140px] flex items-center justify-center my-2"
      >
        <p
          id="storyText"
          class="text-gray-800 text-lg md:text-xl font-bold leading-relaxed whitespace-pre-line"
        >
          <!-- Text populated via JS -->
        </p>
      </div>

      <!-- Action Buttons Container -->
      <div
        id="buttonArea"
        class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4 min-h-[60px] relative"
      >
        <!-- Buttons injected via JS -->
      </div>
    </main>

    <!-- Forgive Celebration Modal -->
    <div
      id="forgiveModal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border-4 border-rose-200 transform scale-95 transition-transform duration-300 relative overflow-hidden"
      >
        <!-- Decorative Hearts -->
        <div class="text-5xl mb-3 animate-bounce">💖</div>
        <h2 class="text-2xl font-bold text-rose-600 mb-4">
          သဲလေးက အကောင်းဆုံးပဲ!
        </h2>
        <p
          class="text-gray-700 text-base md:text-lg leading-relaxed whitespace-pre-line mb-6 font-semibold"
        >
          အရမ်းချစ်တယ်နော် အာဘွား.......😘 ကို အသံသွင်းပြီးထည့်မလို့ဘဲ
          ရှော့အကြီးကြီးရှိနေလို့ မထည့်တော့တာပါ။ သဲစကား ကိုနားထောင်ပါ့မယ် 🥰
        </p>
      </div>
    </div>

    <!-- Reject Sad Modal -->
    <div
      id="rejectModal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border-4 border-gray-200 transform scale-95 transition-transform duration-300"
      >
        <div class="text-6xl mb-3">💔😭</div>
        <h2 class="text-2xl font-bold text-gray-700 mb-3">
          ဝမ်းနည်းလိုက်တာ...
        </h2>
        <p class="text-rose-500 text-xl font-bold leading-relaxed mb-6">
          ရက်စက်လိုက်တာ သဲရယ်... 🥺💔
        </p>
        <button
          onclick="restartFlow()"
          class="bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all"
        >
          ပြန်စဉ်းစားမယ် 🥺
        </button>
      </div>
    </div>

    <script>
      // Audio Synthesizer Effects using Web Audio API
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new AudioContext();
        }
      }

      function playSound(type) {
        try {
          initAudio();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          const now = audioCtx.currentTime;

          if (type === "next") {
            // Cute chime pop
            osc.type = "sine";
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
          } else if (type === "dodge") {
            // Boing/dodge sound
            osc.type = "triangle";
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
          } else if (type === "love") {
            // Heart success chord
            const freqs = [523.25, 659.25, 783.99, 1046.5];
            freqs.forEach((f, i) => {
              const o = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              o.type = "sine";
              o.frequency.value = f;
              o.connect(g);
              g.connect(audioCtx.destination);
              g.gain.setValueAtTime(0.1, now + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + 0.5 + i * 0.08);
              o.start(now + i * 0.08);
              o.stop(now + 0.5 + i * 0.08);
            });
          } else if (type === "sad") {
            // Sad descending tone
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
          }
        } catch (e) {
          console.log("Audio playback prevented or unsupported");
        }
      }

      // Flow States
      let currentStep = 1;
      let rejectClickCount = 0;

      // Myanmar Texts and Emojis mapping
      const steps = [
        {
          text: "ကိုမနေ့က တရုတ်အဖွဲ့တစ်ခုက ကို့ကို မျက်နှာပြောင်လို့\n သွား hack လိုက်တာ သဲ sticker တွေ့လို့ယူလိုက်တာ သဲရဲ့",
          sticker: "🐱‍💻",
        },
        {
          text: "သဲမကြိုက်ရင် နောက်တစ်ခါအဲ့လိုမလုပ်တော့ဘူးနော် ကတိကတိ",
          sticker: "🥺👉👈",
        },
        {
          text: "မနေ့က အဖြစ်အပျက်အတွက် ကိုတောင်းပန်ပါတယ် သဲရယ်......",
          sticker: "🙇‍♂️🌸",
        },
      ];

      const rejectButtonTexts = [
        "ခွင့်မလွှတ်ဘူး",
        "တကယ်ကြီးလား!!",
        "သေချာစဉ်းစားပါဦး",
        "နှိပ်လို့မရတော့ဘူး",
        "ဟ!!",
        "သဲသဘောပါဘဲ",
      ];

      // DOM elements
      const storyTextEl = document.getElementById("storyText");
      const stickerIconEl = document.getElementById("stickerIcon");
      const buttonAreaEl = document.getElementById("buttonArea");
      const contentBoxEl = document.getElementById("contentBox");

      // Render current step
      function renderStep() {
        // Trigger animation
        contentBoxEl.classList.remove("fade-in");
        void contentBoxEl.offsetWidth; // trigger reflow
        contentBoxEl.classList.add("fade-in");

        const stepData = steps[currentStep - 1];
        storyTextEl.innerText = stepData.text;
        stickerIconEl.innerText = stepData.sticker;

        buttonAreaEl.innerHTML = "";

        if (currentStep < 3) {
          // Next Button
          const nextBtn = document.createElement("button");
          nextBtn.className =
            "bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transform active:scale-95 transition-all text-lg flex items-center gap-2 pulse-glow";
          nextBtn.innerHTML = `<span>ဆက်သွားမည်</span> <i class="fa-solid fa-arrow-right text-sm"></i>`;
          nextBtn.onclick = () => {
            playSound("next");
            currentStep++;
            renderStep();
          };
          buttonAreaEl.appendChild(nextBtn);
        } else {
          // Step 3 Choice Buttons
          const forgiveBtn = document.createElement("button");
          forgiveBtn.className =
            "bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transform active:scale-95 transition-all text-lg flex items-center gap-2";
          forgiveBtn.innerHTML = `<i class="fa-solid fa-heart"></i> <span>ခွင့်လွှတ်တယ်</span>`;
          forgiveBtn.onclick = handleForgive;

          const rejectBtn = document.createElement("button");
          rejectBtn.id = "rejectBtn";
          rejectBtn.className =
            "runaway-btn bg-gradient-to-r from-rose-400 to-red-500 hover:from-rose-500 hover:to-red-600 text-white font-bold py-3 px-6 rounded-full shadow-md text-lg flex items-center gap-2";
          rejectBtn.innerText = rejectButtonTexts[0];

          // Move only after a click so the label always updates on an attempt.
          rejectBtn.onclick = (e) => handleRejectClick(e);

          buttonAreaEl.appendChild(forgiveBtn);
          buttonAreaEl.appendChild(rejectBtn);
        }
      }

      // Handle "ခွင့်လွှတ်တယ်" Click
      function handleForgive() {
        playSound("love");
        createSparkles();
        const modal = document.getElementById("forgiveModal");
        modal.classList.remove("hidden");
        setTimeout(() => {
          modal.classList.remove("opacity-0");
          modal.querySelector("div").classList.remove("scale-95");
          modal.querySelector("div").classList.add("scale-100");
        }, 10);
      }

      // Move reject button to random position
      function moveRejectButton(btn) {
        playSound("dodge");
        btn.style.position = "absolute";

        const btnWidth = btn.offsetWidth || 140;
        const btnHeight = btn.offsetHeight || 50;
        const areaRect = buttonAreaEl.getBoundingClientRect();
        const padding = 20;
        const minX = Math.min(padding, Math.max(0, window.innerWidth - btnWidth));
        const minY = Math.min(padding, Math.max(0, window.innerHeight - btnHeight));
        const maxX = Math.max(minX, window.innerWidth - btnWidth - padding);
        const maxY = Math.max(minY, window.innerHeight - btnHeight - padding);
        const viewportX = minX + Math.floor(Math.random() * (maxX - minX + 1));
        const viewportY = minY + Math.floor(Math.random() * (maxY - minY + 1));

        btn.style.left = `${viewportX - areaRect.left}px`;
        btn.style.top = `${viewportY - areaRect.top}px`;
        btn.style.zIndex = "40";
      }

      function handleRejectClick(e) {
        const btn = e.currentTarget;
        rejectClickCount++;

        if (rejectClickCount < 4) {
          btn.innerText = rejectButtonTexts[rejectClickCount];
          moveRejectButton(btn);
        } else {
          // 4th click: Trigger sad response
          playSound("sad");
          const modal = document.getElementById("rejectModal");
          modal.classList.remove("hidden");
          setTimeout(() => {
            modal.classList.remove("opacity-0");
            modal.querySelector("div").classList.remove("scale-95");
            modal.querySelector("div").classList.add("scale-100");
          }, 10);
        }
      }

      // Restart Flow
      function restartFlow() {
        currentStep = 1;
        rejectClickCount = 0;

        // Hide modals
        ["forgiveModal", "rejectModal"].forEach((id) => {
          const modal = document.getElementById(id);
          modal.classList.add("opacity-0");
          modal.querySelector("div").classList.remove("scale-100");
          modal.querySelector("div").classList.add("scale-95");
          setTimeout(() => modal.classList.add("hidden"), 300);
        });

        renderStep();
      }

      // Create Background Animated Hearts
      function createBackgroundHearts() {
        const container = document.getElementById("heartsContainer");
        const heartIcons = ["💖", "💕", "🌸", "✨", "💗"];

        for (let i = 0; i < 20; i++) {
          const heart = document.createElement("div");
          heart.className = "bg-heart";
          heart.innerText =
            heartIcons[Math.floor(Math.random() * heartIcons.length)];
          heart.style.left = `${Math.random() * 100}vw`;
          heart.style.animationDuration = `${5 + Math.random() * 6}s`;
          heart.style.animationDelay = `${Math.random() * 5}s`;
          heart.style.fontSize = `${16 + Math.random() * 24}px`;
          container.appendChild(heart);
        }
      }

      // Sparkle Explosion Effect
      function createSparkles() {
        for (let i = 0; i < 30; i++) {
          const sparkle = document.createElement("div");
          sparkle.className = "sparkle text-rose-500 text-xl";
          sparkle.innerText = ["❤️", "💖", "✨", "🌸"][
            Math.floor(Math.random() * 4)
          ];
          sparkle.style.left = `${50 + (Math.random() - 0.5) * 60}%`;
          sparkle.style.top = `${50 + (Math.random() - 0.5) * 60}%`;
          document.body.appendChild(sparkle);

          setTimeout(() => sparkle.remove(), 800);
        }
      }

      // Init on Window Load
      window.onload = function () {
        createBackgroundHearts();
        renderStep();
      };
    </script>
  </body>
</html>
